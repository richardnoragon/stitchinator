services:
  stitchinator:
    build: .
    image: stitchinator:v0.1.0-alpha.20
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      STITCHINATOR_BACKUPS: /backups
    group_add:
      - "${STITCHINATOR_BACKUP_GID:-1000}"
    volumes:
      - stitchinator-data:/data
      - type: bind
        source: ${STITCHINATOR_BACKUP_DIR:-./backups/automatic}
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    restart: unless-stopped
volumes:
  stitchinator-data:
